[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hecke-lab"
version = "0.2.0"
description = "A small experimental lab for Hecke-like compositional operators in AI workflows."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hecke-Lab contributors" }]
license = { text = "MIT" }
keywords = ["hecke-algebra", "ai", "agents", "operators", "compositionality", "representation-theory"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
